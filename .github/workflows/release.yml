name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: libssh2 version to build. Becomes the package tag and release name.
        required: true
        default: "1.11.1"
      openssl_version:
        description: OpenSSL-Apple release to compile against.
        required: true
        default: "4.0.3"

permissions:
  contents: write

env:
  LIBSSH2_VERSION: ${{ inputs.version }}
  OPENSSL_VERSION: ${{ inputs.openssl_version }}
  ASSET_NAME: libssh2.xcframework.zip

jobs:
  check:
    name: Check that the release does not exist yet
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          if gh release view "$LIBSSH2_VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release $LIBSSH2_VERSION already exists. Delete the release and its tag before rebuilding."
            exit 1
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: check
    runs-on: macos-latest
    strategy:
      matrix:
        platform: [macos, ios, iossimulator]
    steps:
      - uses: actions/checkout@v7
      - name: Download libssh2 source
        run: scripts/download-source.sh "$LIBSSH2_VERSION" "$RUNNER_TEMP/source"
      - name: Download OpenSSL.xcframework
        run: scripts/download-openssl.sh "$OPENSSL_VERSION" "$RUNNER_TEMP/openssl"
      - name: Build
        run: scripts/build-slice.sh "$RUNNER_TEMP/source/libssh2-$LIBSSH2_VERSION.tar.gz" "${{ matrix.platform }}" "$RUNNER_TEMP/openssl/OpenSSL.xcframework" "slices/${{ matrix.platform }}"
      - uses: actions/upload-artifact@v7
        with:
          name: slice-${{ matrix.platform }}
          path: slices/${{ matrix.platform }}
          if-no-files-found: error

  release:
    name: Package and release
    needs: build
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: slice-*
          path: slices
      - name: Strip artifact name prefix
        run: for dir in slices/slice-*; do mv "$dir" "slices/${dir#slices/slice-}"; done
      - name: Download libssh2 source for the license file
        run: |
          scripts/download-source.sh "$LIBSSH2_VERSION" "$RUNNER_TEMP/source"
          tar xzf "$RUNNER_TEMP/source/libssh2-$LIBSSH2_VERSION.tar.gz" -C "$RUNNER_TEMP/source" "libssh2-$LIBSSH2_VERSION/COPYING"
      - name: Create XCFramework
        run: scripts/create-xcframework.sh slices "$RUNNER_TEMP/source/libssh2-$LIBSSH2_VERSION/COPYING" libssh2.xcframework
      - name: Zip
        run: ditto -c -k --keepParent libssh2.xcframework "$ASSET_NAME"
      - name: Update Package.swift
        id: manifest
        run: |
          ASSET_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$LIBSSH2_VERSION/$ASSET_NAME"
          CHECKSUM=$(scripts/update-manifest.sh "$ASSET_URL" "$ASSET_NAME")
          echo "url=$ASSET_URL" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
      - name: Write release notes
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          Static libssh2 $LIBSSH2_VERSION for macOS (arm64, x86_64), iOS (arm64) and iOS Simulator (arm64, x86_64), compiled against OpenSSL $OPENSSL_VERSION from https://github.com/mbernson/OpenSSL-Apple.

          | | |
          |---|---|
          | Asset | ${{ steps.manifest.outputs.url }} |
          | SPM checksum | \`${{ steps.manifest.outputs.checksum }}\` |
          | Source SHA-256 | \`$(awk '{print $1}' "$RUNNER_TEMP/source/libssh2-$LIBSSH2_VERSION.tar.gz.sha256")\` |
          | Built from | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID |
          NOTES
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit Package.swift
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release libssh2 $LIBSSH2_VERSION"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Create release
        run: |
          gh release create "$LIBSSH2_VERSION" "$ASSET_NAME" \
            --target "$(git rev-parse HEAD)" \
            --title "libssh2 $LIBSSH2_VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"

  verify:
    name: Verify the published package from a consumer
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/verify-release.sh "$LIBSSH2_VERSION" "$OPENSSL_VERSION" "https://github.com/$GITHUB_REPOSITORY.git"
